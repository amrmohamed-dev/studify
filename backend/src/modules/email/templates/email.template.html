<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{templateTitle}}</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f5f8fa; font-family: 'Poppins', Arial, sans-serif; color:#333;">
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
      <tr>
        <td align="center" style="padding:40px 0;">
          <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" style="max-width:600px; background:#ffffff; border-radius:16px; box-shadow:0 4px 15px rgba(0,0,0,0.08); padding:40px 30px; text-align:center;">
            
            <tr>
              <td style="padding-bottom:25px;">
                <img 
                  src="https://res.cloudinary.com/dudarfssg/image/upload/v1773856362/main_logo-removebg-preview_asc8ds.png" 
                  alt="Studify Logo"
                  width="120"
                  style="display:block; margin:0 auto;"
                />
              </td>
            </tr>

            <tr>
              <td style="font-size:24px; font-weight:700; padding-bottom:10px; color: #1a5a92;">
                {{templateTitle}}
              </td>
            </tr>

            <tr>
              <td style="font-size:16px; line-height:1.6; color:#555; padding:10px 0;">
                Hello {{name}},
              </td>
            </tr>

            <tr>
              <td style="font-size:16px; line-height:1.6; padding:10px 0; color:#555;">
                Your one-time password (OTP) to access <strong>Studify</strong> is:
              </td>
            </tr>

            <tr>
              <td style="padding:25px 0;">
                <div style="font-size:32px; font-weight:bold; letter-spacing:8px; background: linear-gradient(90deg, #1a5a92, #23679f); color:#ffffff; display:inline-block; padding:16px 32px; border-radius:12px; box-shadow: 0 4px 12px rgba(26,90,146,0.3);">
                  {{otp}}
                </div>
              </td>
            </tr>

            <tr>
              <td style="font-size:14px; line-height:1.6; color:#777; padding:10px 0;">
                This code is valid for <strong style="color:#1a5a92;">10 minutes</strong>.<br/>
                If you didn't request this code, please ignore this email or contact support.
              </td>
            </tr>

            <tr>
              <td style="font-size:12px; color:#999; padding-top:30px; border-top:1px solid #eee;">
                &copy; {{year}} <strong style="color:#1a5a92;">Studify</strong>. Learn. Collaborate. Succeed.
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
