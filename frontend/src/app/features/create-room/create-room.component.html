<app-navbar></app-navbar>

<div class="create-room-page page-card">
  <h1>Create a New Room</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <label>
      Room Name
      <input type="text" formControlName="name" placeholder="e.g. Calculus Study Group" />
      <small class="error" *ngIf="nameCtrl.touched && nameCtrl.invalid">
        Name must be 3-50 characters.
      </small>
    </label>

    <label>
      Privacy Type
      <select formControlName="privacyType">
        <option value="public">Public</option>
        <option value="private_request">Private (Request to Join)</option>
        <option value="private_password">Private (Password)</option>
      </select>
    </label>

    <label *ngIf="form.value.privacyType === 'private_password'">
      Room Password
      <input type="password" formControlName="password" placeholder="At least 6 characters" />
      <small class="error" *ngIf="passwordCtrl.touched && passwordCtrl.invalid">
        Password must be at least 6 characters.
      </small>
    </label>

    <label>
      Max Members
      <input type="number" formControlName="maxMembers" min="1" max="10" />
    </label>

    <label>
      Room Image (optional)
      <input type="file" accept="image/*" (change)="onFileSelected($event)" />
    </label>

    <img *ngIf="imagePreview" [src]="imagePreview" class="preview" alt="preview" />

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <div class="actions">
      <button type="button" class="btn-secondary" (click)="onCancel()">Cancel</button>
      <button type="submit" class="btn-primary" [disabled]="isLoading">
        {{ isLoading ? 'Creating...' : 'Create Room' }}
      </button>
    </div>
  </form>
</div>

<app-footer></app-footer>
