<div class="join-page">

  <main class="join-page__form-wrap">
    <div class="join-page__form-card">

      <div class="join-page__form-header">
        <h1 class="join-page__title">Join a Room</h1>
        <p class="join-page__subtitle">Enter your credentials to access the shared workspace.</p>
      </div>

      <form [formGroup]="joinForm" (ngSubmit)="onSubmit()" novalidate>


        <div class="form-field">
          <label class="form-field__label" for="roomCode">ROOM CODE OR NAME</label>
          <div class="form-field__input-wrap" [class.form-field__input-wrap--error]="roomCodeCtrl.invalid && roomCodeCtrl.touched">
            <span class="form-field__icon form-field__icon--hash">#</span>
            <input
              id="roomCode"
              type="text"
              class="form-field__input"
              placeholder="e.g. ARCH-2024-STUDIO"
              formControlName="roomCode"
              autocomplete="off"
              />
            </div>
            @if (roomCodeCtrl.invalid && roomCodeCtrl.touched) {
              <span class="form-field__error">
                Please enter a valid room code or name.
              </span>
            }
          </div>

          <div class="form-field">
            <label class="form-field__label" for="password">ROOM PASSWORD (OPTIONAL)</label>
            <div class="form-field__input-wrap">
              <span class="form-field__icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="currentColor" stroke-width="1.8"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
              </span>
              <input
                id="password"
                type="password"
                class="form-field__input"
                placeholder="••••••••"
                formControlName="password"
                />
              </div>
            </div>

            @if (showAdminNotice) {
              <div class="join-page__notice">
                <span class="join-page__notice-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="#f5a623" stroke-width="1.8"/>
                    <line x1="12" y1="8" x2="12" y2="12" stroke="#f5a623" stroke-width="1.8" stroke-linecap="round"/>
                    <line x1="12" y1="16" x2="12.01" y2="16" stroke="#f5a623" stroke-width="2" stroke-linecap="round"/>
                  </svg>
                </span>
                <p class="join-page__notice-text">
                  This room requires admin approval. You will be placed in a waiting queue once you join.
                </p>
              </div>
            }


            <button type="submit" class="btn btn--primary" [class.btn--loading]="isLoading" [disabled]="isLoading">
              @if (!isLoading) {
                <span>Join Room &nbsp;→</span>
              }
              @if (isLoading) {
                <span class="btn__spinner"></span>
              }
            </button>

          </form>


          <div class="join-page__form-footer">
            <a href="#" class="join-page__footer-link">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.6"/>
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <line x1="12" y1="17" x2="12.01" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
              Help Center
            </a>
            <button type="button" class="join-page__footer-link" (click)="onCancel()">
              &times; Cancel
            </button>
          </div>

        </div>
      </main>

    </div>
