<div class="room-card page-card" (click)="onViewRoom()">
  <div class="room-image">
    <img
      [src]="room.image || 'assets/images/room-placeholder.jpg'"
      alt="room"
    />
    <span class="room-type" [class.private]="room.status === 'private'">
      {{ room.status === 'private' ? 'Private' : 'Public' }}
    </span>
  </div>

  <div class="room-content">
    <h3 class="room-title">{{ room.name }}</h3>

    <p class="room-members">
      👥 {{ room.membersCount }} members
    </p>

    <button
      class="btn-primary join-btn"
      (click)="onJoinRoom(); $event.stopPropagation()"
    >
      Join Room
    </button>
  </div>
</div>
